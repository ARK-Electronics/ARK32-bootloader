# config for openocd for NXP MCXA133 (Cortex-M33) MCUs
# The MR-ESC-AM32 board is debugged over SWD via an on-board or
# external CMSIS-DAP (MCU-Link) probe. OpenOCD has no dedicated
# MCXA target file, so a generic Cortex-M33 target is declared here.
source [find interface/cmsis-dap.cfg]

transport select swd
adapter speed 2000

set _CHIPNAME mcxa133
set _WORKAREASIZE 0x8000

swd newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

set _TARGETNAME $_CHIPNAME.cpu

# use -gdb-max-connections to allow for live watch in vscode
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0 -gdb-max-connections 4
init
